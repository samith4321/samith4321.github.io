<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager — Samith Prabhu</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0a0a0f; --surface:#111118; --card:#16161f; --border:#222230;
      --gold:#c9a84c; --gold-dim:#8b6914; --text:#e8e8f0; --muted:#7878a0;
      --green:#22c55e; --red:#ef4444; --accent:#4f8ef7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; }
    header { background: rgba(10,10,15,0.95); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); }
    header a { font-family: 'Syne', sans-serif; font-weight: 800; color: var(--gold); text-decoration: none; }
    header span { font-size: 0.8rem; color: var(--muted); }
    .container { max-width: 860px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }

    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 28px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
    .stat-card .num { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; color: var(--gold); }
    .stat-card .lbl { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 100%; max-width: 480px; }
    .modal h2 { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; color: var(--gold); margin-bottom: 20px; letter-spacing: 0.5px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); font-weight: 500; margin-bottom: 5px; }
    input, select, textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 300; width: 100%; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold-dim); }
    textarea { resize: vertical; min-height: 70px; }
    select option { background: var(--surface); }
    .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary { background: var(--gold); color: #0a0a0f; border: none; padding: 10px 24px; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 0.88rem; cursor: pointer; transition: opacity 0.15s; flex: 1; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-secondary { background: var(--surface); color: var(--muted); border: 1px solid var(--border); padding: 10px 24px; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; cursor: pointer; }

    /* Toolbar */
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
    .filters { display: flex; gap: 8px; }
    .filter-btn { padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; background: var(--card); border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.15s; }
    .filter-btn.active { background: var(--gold); border-color: var(--gold); color: #0a0a0f; font-weight: 500; }
    .btn-new { background: var(--gold); color: #0a0a0f; border: none; padding: 9px 20px; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 0.85rem; cursor: pointer; transition: opacity 0.15s; }
    .btn-new:hover { opacity: 0.85; }

    /* Tasks */
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; display: flex; align-items: flex-start; gap: 14px; transition: border-color 0.15s; }
    .task-card:hover { border-color: var(--gold-dim); }
    .task-card.done { opacity: 0.5; }
    .task-card.done .task-title { text-decoration: line-through; color: var(--muted); }
    .check-btn { background: none; border: 2px solid var(--border); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .check-btn.checked { background: var(--green); border-color: var(--green); }
    .task-body { flex: 1; }
    .task-title { font-size: 0.95rem; font-weight: 400; margin-bottom: 5px; }
    .task-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    .task-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .cat-badge { padding: 2px 9px; border-radius: 10px; background: rgba(201,168,76,0.1); color: var(--gold); font-size: 0.7rem; font-weight: 500; }
    .due-badge { font-size: 0.72rem; color: var(--muted); }
    .due-badge.overdue { color: var(--red); }
    .task-actions { display: flex; gap: 6px; }
    .btn-icon { background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; transition: all 0.15s; }
    .btn-icon:hover { border-color: var(--gold-dim); color: var(--text); }
    .btn-icon.del:hover { border-color: var(--red); color: var(--red); background: rgba(239,68,68,0.08); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }

    @media(max-width: 600px) {
      header { padding: 14px 16px; }
      .container { padding: 24px 16px; }
      .toolbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html">← SP</a>
  <span>Task Manager</span>
</header>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">ADD TASK</h2>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="inp-title" placeholder="e.g. Complete DSA assignment"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="inp-desc" placeholder="Optional details..."></textarea>
    </div>
    <div class="form-group">
      <label>Due Date</label>
      <input type="date" id="inp-due"/>
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="inp-cat">
        <option>General</option><option>Assignment</option><option>Exam Prep</option>
        <option>Project</option><option>Lab</option><option>Personal</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn-primary" onclick="saveTask()">Save Task</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="container">
  <h1>Task Manager</h1>
  <p class="subtitle">Track assignments, projects, and deadlines. Data saved in your browser.</p>

  <div class="stats">
    <div class="stat-card"><div class="num" id="s-total">0</div><div class="lbl">Total</div></div>
    <div class="stat-card"><div class="num" id="s-done">0</div><div class="lbl">Done</div></div>
    <div class="stat-card"><div class="num" id="s-pending">0</div><div class="lbl">Pending</div></div>
  </div>

  <div class="toolbar">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
      <button class="filter-btn" onclick="setFilter('done',this)">Done</button>
    </div>
    <button class="btn-new" onclick="openModal()">+ New Task</button>
  </div>

  <div class="task-list" id="task-list"></div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem('sp_tasks') || '[]');
let filter = 'all';
let editId = null;

function save() { localStorage.setItem('sp_tasks', JSON.stringify(tasks)); }

function openModal(id = null) {
  editId = id;
  if (id) {
    const t = tasks.find(t => t.id === id);
    document.getElementById('modal-title').textContent = 'EDIT TASK';
    document.getElementById('inp-title').value = t.title;
    document.getElementById('inp-desc').value = t.desc || '';
    document.getElementById('inp-due').value = t.due || '';
    document.getElementById('inp-cat').value = t.cat;
  } else {
    document.getElementById('modal-title').textContent = 'ADD TASK';
    document.getElementById('inp-title').value = '';
    document.getElementById('inp-desc').value = '';
    document.getElementById('inp-due').value = '';
    document.getElementById('inp-cat').value = 'General';
  }
  document.getElementById('modal').classList.add('open');
  document.getElementById('inp-title').focus();
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function saveTask() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) { alert('Title is required.'); return; }
  const data = { title, desc: document.getElementById('inp-desc').value.trim(), due: document.getElementById('inp-due').value, cat: document.getElementById('inp-cat').value };
  if (editId) {
    const i = tasks.findIndex(t => t.id === editId);
    tasks[i] = { ...tasks[i], ...data };
  } else {
    tasks.unshift({ id: Date.now(), done: false, ...data });
  }
  save(); render(); closeModal();
}

function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  t.done = !t.done;
  save(); render();
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save(); render();
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function isOverdue(due) {
  if (!due) return false;
  return new Date(due) < new Date(new Date().toISOString().slice(0,10));
}

function render() {
  const total = tasks.length, done = tasks.filter(t=>t.done).length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-pending').textContent = total - done;

  let filtered = tasks;
  if (filter === 'pending') filtered = tasks.filter(t => !t.done);
  if (filter === 'done') filtered = tasks.filter(t => t.done);

  const list = document.getElementById('task-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">✅</div><p>No tasks here. ${filter==='all'?'Add one above!':''}</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(t => `
    <div class="task-card ${t.done?'done':''}">
      <button class="check-btn ${t.done?'checked':''}" onclick="toggleDone(${t.id})">${t.done?'✓':''}</button>
      <div class="task-body">
        <div class="task-title">${t.title}</div>
        ${t.desc ? `<div class="task-desc">${t.desc}</div>` : ''}
        <div class="task-meta">
          <span class="cat-badge">${t.cat}</span>
          ${t.due ? `<span class="due-badge ${!t.done && isOverdue(t.due)?'overdue':''}">📅 ${t.due}${!t.done && isOverdue(t.due)?' · overdue':''}</span>` : ''}
        </div>
      </div>
      <div class="task-actions">
        <button class="btn-icon" onclick="openModal(${t.id})">Edit</button>
        <button class="btn-icon del" onclick="deleteTask(${t.id})">Del</button>
      </div>
    </div>`).join('');
}

document.getElementById('modal').addEventListener('click', e => { if(e.target === e.currentTarget) closeModal(); });
render();
</script>
</body>
</html>
